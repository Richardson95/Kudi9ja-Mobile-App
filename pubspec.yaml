name: kudi9ja
description: "Kudi9ja — Pay smart. Pay global. Microlending & high-yield savings."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.69.2
  flutter_animate: ^4.5.0
  local_auth: ^2.3.0
  uuid: ^4.5.1
  crypto: ^3.0.7
  image_picker: ^1.2.3
  # Talking to the Kudi9ja server.
  http: ^1.2.2
  http_parser: ^4.0.2
  # Tokens go in the platform keystore, not shared_preferences: a refresh token
  # is a bearer credential worth thirty days of access.
  flutter_secure_storage: ^9.2.2
  # Receiving push. The server already sends through Firebase whenever money
  # moves; these are what let a handset hear it.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/icons/app_icon_foreground.png
  android_12:
    color: "#000000"
    image: assets/icons/app_icon_foreground.png
    icon_background_color: "#000000"
